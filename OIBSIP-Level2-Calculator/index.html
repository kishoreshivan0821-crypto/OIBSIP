<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <header class="calculator-header">
            <div>
                <h1>CALC</h1>
                <p>MORE THAN JUST NUMBERS</p>
            </div>

            <div class="header-icons">
    <button id="historyButton" class="history-button">History</button>
    <span>◐</span>
    <span>⚙</span>
</div>
        </header>

        <section class="display-area">
            <div id="expression"></div>
            <input type="text" id="display" value="0" readonly>
        </section>

        <div class="calculator-content">

            <section class="keypad">

                <button class="function clear" id="clear">AC</button>
                <button class="function" id="backspace">⌫</button>
                <button class="function" id="percentage">%</button>
                <button class="operator" data-operator="*">×</button>

                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator" data-operator="/">÷</button>

                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator" data-operator="-">−</button>

                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator" data-operator="+">+</button>

                <button class="number zero">0</button>
                <button id="decimal">.</button>
                <button id="equals">=</button>

            </section>

            <aside class="history-panel">
                <div class="history-header">
                    <h2>History</h2>
                    <button id="clearHistory">♧</button>
                </div>

                <div id="historyList">
                    <p class="empty-history">No calculations yet</p>
                </div>
            </aside>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
